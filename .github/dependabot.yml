version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'zaito'
    assignees:
      - 'zaito'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright*'
      eslint:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'typescript-eslint*'
      testing:
        patterns:
          - '@axe-core/*'
          - 'zod'
      build:
        patterns:
          - 'typescript'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
