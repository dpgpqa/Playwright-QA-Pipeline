version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:00'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps):'
    groups:
      playwright:
        patterns:
          - '@playwright/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint*'
      testing:
        patterns:
          - '@axe-core/*'
          - 'zod'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
