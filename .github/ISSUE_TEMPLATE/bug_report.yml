name: Bug Report
description: Report a test failure or pipeline issue
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below.
  - type: dropdown
    id: layer
    attributes:
      label: Test Layer
      options:
        - E2E (@smoke/@regression)
        - API (@api)
        - Accessibility (@a11y)
        - Visual (@visual)
        - CI/Infrastructure
        - Other
    validations:
      required: true
  - type: input
    id: test-name
    attributes:
      label: Test Name
      placeholder: e.g., @smoke User can login successfully
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error Message / Stack Trace
      placeholder: Paste error output here
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `npm run test:smoke`
        2. Observe failure in Login test
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always (deterministic)
        - Intermittent (flaky)
        - Only on CI
        - Only locally
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: local / CI / staging / production
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked for existing issues
          required: true
        - label: I have run the test locally
          required: false
        - label: This is not a secret/credential issue
          required: true
