ci:
  collect:
    numberOfRuns: 3
    startServerCommand: 'cd test-server && npm start &'
    url:
      - 'http://localhost:3000'
    settings:
      headless: true
      preset: 'desktop'
  assert:
    assertions:
      categories:performance: ['error', { minScore: 0.3 }]
      categories:accessibility: ['error', { minScore: 0.7 }]
      categories:best-practices: ['error', { minScore: 0.6 }]
      categories:seo: ['warn', { minScore: 0.5 }]
  upload:
    target: 'temporary-public-storage'
